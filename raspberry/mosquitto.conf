# ============================================================
# CapaSense - configuración del broker Mosquitto
# Raspberry Pi: /etc/mosquitto/conf.d/capasense.conf
# Laptop con Windows: C:\mosquitto\mosquitto.conf
# ============================================================

# Escuchar en el puerto 1883 en todas las interfaces de la red local
# (desde Mosquitto 2.0, sin esta línea solo acepta conexiones locales).
listener 1883 0.0.0.0

# Solo clientes con usuario y contraseña.
allow_anonymous false
# Raspberry Pi:
password_file /etc/mosquitto/passwd
# Windows (cambiar la línea anterior por esta):
# password_file C:\mosquitto\passwd

# ------------------------------------------------------------
# Puente SOLO para la demostración con Wokwi.
# El ESP32 simulado publica en broker.hivemq.com y este puente
# trae esos mensajes al broker local. Con el ESP32 real, borrar
# o comentar todo este bloque.
# ------------------------------------------------------------
connection puente-wokwi
address broker.hivemq.com:1883
bridge_protocol_version mqttv311
remote_clientid capasense-puente-25057
try_private false
notifications false
cleansession true
topic capasense/nodo01/conteo in 0
topic capasense/nodo01/sala in 0
topic capasense/nodo01/ambiente in 0
topic capasense/nodo01/alerta in 0
topic capasense/nodo01/estado in 0
topic capasense/nodo01/conexion in 0
topic capasense/nodo01/cmd out 0
